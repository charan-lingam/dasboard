<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskForge — Universal Task Dashboard</title>
  <meta name="description" content="A Jira-like universal task dashboard for managing projects, tracking progress, and assigning responsibilities." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ═══════════════════════════════ SIDEBAR ═══════════════════════════════ -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="url(#brand-grad)" />
          <path d="M8 10h12M8 14h8M8 18h10" stroke="#fff" stroke-width="2" stroke-linecap="round" />
          <defs>
            <linearGradient id="brand-grad" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#6C5CE7" />
              <stop offset="1" stop-color="#00CEFF" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-name">TaskForge</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="board" id="nav-board">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Board</span>
      </button>
      <button class="nav-item" data-view="list" id="nav-list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
        <span>List</span>
      </button>
      <button class="nav-item" data-view="timeline" id="nav-timeline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><circle cx="12" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18" r="2"/><line x1="14" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="10" y2="12"/><line x1="14" y1="18" x2="20" y2="18"/></svg>
        <span>Timeline</span>
      </button>
    </nav>

    <div class="sidebar-section">
      <h3 class="sidebar-section-title">Projects</h3>
      <div id="project-list" class="project-list">
        <!-- dynamically filled -->
      </div>
      <button class="add-project-btn" id="add-project-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Project
      </button>
    </div>

    <div class="sidebar-section sidebar-section-teams">
      <h3 class="sidebar-section-title">Teams</h3>
      <div id="team-list" class="team-list">
        <!-- dynamically filled -->
      </div>
      <button class="add-project-btn" id="add-team-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Team
      </button>
    </div>

    <div class="sidebar-footer">
      <button id="export-btn" class="footer-action" title="Export JSON">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button id="import-btn" class="footer-action" title="Import JSON">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" id="import-file" accept=".json" hidden />
    </div>
  </aside>

  <!-- Sidebar Mobile Backdrop Overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

  <!-- ═══════════════════════════════ MAIN ═══════════════════════════════ -->
  <main id="main" class="main">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="current-project-title" class="topbar-title">All Tasks</h1>
        <span id="task-count-badge" class="badge">0</span>
      </div>
      <div class="topbar-right">
        <div class="search-box" id="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search tasks…" autocomplete="off" />
        </div>
        <div class="filter-group">
          <select id="filter-priority" class="filter-select" title="Filter by priority">
            <option value="">All Priorities</option>
            <option value="critical">🔴 Critical</option>
            <option value="high">🟠 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
          <select id="filter-team" class="filter-select" title="Filter by team">
            <option value="">All Teams</option>
          </select>
        </div>
        <button id="new-task-btn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Task
        </button>
      </div>
    </header>

    <!-- Board View -->
    <section id="view-board" class="view view-board active">
      <div class="board-columns" id="board-columns">
        <div class="board-column" data-status="backlog">
          <div class="column-header">
            <span class="column-dot" style="background:#8B95A5"></span>
            <h2>Backlog</h2>
            <span class="column-count" data-count="backlog">0</span>
          </div>
          <div class="column-cards" data-status="backlog"></div>
        </div>
        <div class="board-column" data-status="todo">
          <div class="column-header">
            <span class="column-dot" style="background:#6C5CE7"></span>
            <h2>To Do</h2>
            <span class="column-count" data-count="todo">0</span>
          </div>
          <div class="column-cards" data-status="todo"></div>
        </div>
        <div class="board-column" data-status="in-progress">
          <div class="column-header">
            <span class="column-dot" style="background:#00CEFF"></span>
            <h2>In Progress</h2>
            <span class="column-count" data-count="in-progress">0</span>
          </div>
          <div class="column-cards" data-status="in-progress"></div>
        </div>
        <div class="board-column" data-status="review">
          <div class="column-header">
            <span class="column-dot" style="background:#FDCB6E"></span>
            <h2>In Review</h2>
            <span class="column-count" data-count="review">0</span>
          </div>
          <div class="column-cards" data-status="review"></div>
        </div>
        <div class="board-column" data-status="done">
          <div class="column-header">
            <span class="column-dot" style="background:#00B894"></span>
            <h2>Done</h2>
            <span class="column-count" data-count="done">0</span>
          </div>
          <div class="column-cards" data-status="done"></div>
        </div>
      </div>
    </section>

    <!-- List View -->
    <section id="view-list" class="view view-list">
      <div class="list-table-wrap">
        <table class="list-table">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th class="col-title">Title</th>
              <th class="col-status">Status</th>
              <th class="col-priority">Priority</th>
              <th class="col-team">Team</th>
              <th class="col-due">Due</th>
              <th class="col-project">Project</th>
            </tr>
          </thead>
          <tbody id="list-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Timeline View -->
    <section id="view-timeline" class="view view-timeline">
      <div id="timeline-container" class="timeline-container"></div>
    </section>
  </main>

  <!-- ═══════════════════════ TASK MODAL ═══════════════════════ -->
  <div id="task-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="task-form" class="modal-body">
        <div class="form-row">
          <div class="form-group full">
            <label for="task-title">Title <span class="req">*</span></label>
            <input id="task-title" type="text" required placeholder="e.g. Build login page" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" rows="3" placeholder="What needs to be done?"></textarea>
          </div>
        </div>
        <div class="form-row two-col">
          <div class="form-group">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="backlog">Backlog</option>
              <option value="todo" selected>To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="review">In Review</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🟠 High</option>
              <option value="critical">🔴 Critical</option>
            </select>
          </div>
        </div>
        <div class="form-row two-col">
          <div class="form-group">
            <label>Assign to Teams</label>
            <div id="task-teams-container" class="teams-checkbox-group">
              <!-- Checkboxes dynamically rendered -->
            </div>
          </div>
          <div class="form-group">
            <label for="task-project">Project</label>
            <select id="task-project">
              <option value="">No Project</option>
            </select>
          </div>
        </div>
        <div class="form-row two-col">
          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input id="task-due" type="date" />
          </div>
          <div class="form-group">
            <label for="task-tags">Tags <small>(comma-separated)</small></label>
            <input id="task-tags" type="text" placeholder="ui, backend, bug" />
          </div>
        </div>

        <!-- Subtasks -->
        <div class="form-row">
          <div class="form-group full">
            <label>Subtasks</label>
            <div id="subtask-list" class="subtask-list"></div>
            <div class="subtask-add-row">
              <input id="subtask-input" type="text" placeholder="Add a subtask…" />
              <button type="button" id="add-subtask-btn" class="btn-small">Add</button>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="delete-task-btn" class="btn-danger" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" id="modal-cancel" class="btn-ghost">Cancel</button>
          <button type="submit" class="btn-primary" id="save-task-btn">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════ PROJECT MODAL ═══════════════ -->
  <div id="project-modal" class="modal-overlay" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>New Project</h2>
        <button class="modal-close project-modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="project-form" class="modal-body">
        <div class="form-group full">
          <label for="project-name">Project Name <span class="req">*</span></label>
          <input id="project-name" type="text" required placeholder="e.g. TapeoutX" />
        </div>
        <div class="form-group full">
          <label for="project-color">Color</label>
          <div class="color-picker-row" id="color-picker-row">
            <button type="button" class="color-swatch active" data-color="#6C5CE7" style="background:#6C5CE7"></button>
            <button type="button" class="color-swatch" data-color="#00CEFF" style="background:#00CEFF"></button>
            <button type="button" class="color-swatch" data-color="#00B894" style="background:#00B894"></button>
            <button type="button" class="color-swatch" data-color="#FDCB6E" style="background:#FDCB6E"></button>
            <button type="button" class="color-swatch" data-color="#E17055" style="background:#E17055"></button>
            <button type="button" class="color-swatch" data-color="#D63031" style="background:#D63031"></button>
            <button type="button" class="color-swatch" data-color="#E84393" style="background:#E84393"></button>
            <button type="button" class="color-swatch" data-color="#A29BFE" style="background:#A29BFE"></button>
          </div>
        </div>
        <div class="modal-actions">
          <div class="spacer"></div>
          <button type="button" class="btn-ghost project-modal-close">Cancel</button>
          <button type="submit" class="btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════ TEAM MODAL ═══════════════ -->
  <div id="team-modal" class="modal-overlay" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="team-modal-title">Add Team</h2>
        <button class="modal-close team-modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="team-form" class="modal-body">
        <div class="form-group full">
          <label for="team-name">Team Name <span class="req">*</span></label>
          <input id="team-name" type="text" required placeholder="e.g. Frontend Team" />
        </div>
        <div class="form-group full">
          <label for="team-color-picker">Color</label>
          <div class="color-picker-row" id="team-color-picker-row">
            <button type="button" class="color-swatch-team active" data-color="#6C5CE7" style="background:#6C5CE7"></button>
            <button type="button" class="color-swatch-team" data-color="#00CEFF" style="background:#00CEFF"></button>
            <button type="button" class="color-swatch-team" data-color="#00B894" style="background:#00B894"></button>
            <button type="button" class="color-swatch-team" data-color="#FDCB6E" style="background:#FDCB6E"></button>
            <button type="button" class="color-swatch-team" data-color="#E17055" style="background:#E17055"></button>
            <button type="button" class="color-swatch-team" data-color="#D63031" style="background:#D63031"></button>
            <button type="button" class="color-swatch-team" data-color="#E84393" style="background:#E84393"></button>
            <button type="button" class="color-swatch-team" data-color="#A29BFE" style="background:#A29BFE"></button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="delete-team-btn" class="btn-danger" hidden>Delete Team</button>
          <div class="spacer"></div>
          <button type="button" class="btn-ghost team-modal-close">Cancel</button>
          <button type="submit" class="btn-primary" id="team-submit-btn">Add Team</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
